<!doctype html>
    <html>
    <head>
        <title>Javascript</title>
        <link rel="stylesheet" href="main.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        
    </head>
    <body>
        
        


        <button onclick="change()">Click me...</button>
        <button onclick="glow()">Glow</button>


        <div class="menu">
            Hello World!
        </div>

<div class="gear"></div>

        <script>
            
            var menu = document.querySelector('.menu');
            var gear = document.querySelector('.gear');


            // use Camel Casing for function naming.
            function change() {
                console.log('it works!');
                menu.classList.toggle("active");
                gear.classList.toggle("spin");
                document.body.classList.toggle('dark');

            }

            function glow() {
                console.log('it glows!');
                gear.classList.toggle('glow');
                menu.classList.toggle('glow');
            }
            </script>
    </body>
    </html>
